<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="dark">
  <title>Codex Web Terminal</title>
  <link rel="manifest" href="./manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="./favicon.ico">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/index.css">
  <link rel="stylesheet" href="./css/xterm.css">
  <link rel="stylesheet" href="./css/xterm_customize.css">
  <style>
    :root {
      --app-height: 100vh;
      --page-bg:
        radial-gradient(circle at top, rgba(34, 197, 94, 0.16), transparent 34%),
        radial-gradient(circle at 85% 18%, rgba(59, 130, 246, 0.18), transparent 30%),
        linear-gradient(180deg, #071018 0%, #09131d 45%, #060b12 100%);
      --panel-bg: rgba(7, 15, 24, 0.9);
      --panel-border: rgba(148, 163, 184, 0.2);
      --text-main: #e5eef8;
      --text-subtle: rgba(226, 232, 240, 0.72);
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      --tab-height: 44px;
    }

    html, body {
      min-height: 100%;
      height: var(--app-height);
      margin: 0;
      background: var(--page-bg);
      color: var(--text-main);
      overflow: hidden;
      font-family: "SFMono-Regular", "JetBrains Mono", "Fira Code", Consolas, monospace;
    }

    body.embed-mode {
      background: transparent;
    }

    .hidden {
      display: none !important;
    }

    .page {
      position: relative;
      width: 100vw;
      height: var(--app-height);
      overflow: hidden;
    }

    .shell {
      position: fixed;
      left: 50%;
      top: 50%;
      width: min(1380px, calc(100vw - 32px));
      min-width: 860px;
      height: min(84vh, 980px);
      min-height: 600px;
      max-width: calc(100vw - 16px);
      max-height: calc(100vh - 16px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 24px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      transform: translate(-50%, -50%);
      touch-action: none;
    }

    .shell-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.72), rgba(15, 23, 42, 0.34));
      cursor: move;
      user-select: none;
    }

    .shell-title {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .traffic {
      display: inline-flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .traffic span {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
    }

    .traffic span:nth-child(1) { background: #fb7185; }
    .traffic span:nth-child(2) { background: #f59e0b; }
    .traffic span:nth-child(3) { background: #22c55e; }

    .title-copy strong {
      display: block;
      font-size: 14px;
      letter-spacing: 0.02em;
    }

    .title-copy span {
      display: block;
      margin-top: 3px;
      color: var(--text-subtle);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .shell-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .shell-hints {
      color: var(--text-subtle);
      font-size: 12px;
      text-align: right;
      line-height: 1.6;
    }

    .tool-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .tool-button {
      appearance: none;
      border: 1px solid rgba(148, 163, 184, 0.22);
      background: rgba(15, 23, 42, 0.55);
      color: var(--text-main);
      border-radius: 999px;
      padding: 8px 12px;
      font: inherit;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }

    .tool-button:hover {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(14, 165, 233, 0.14);
    }

    .tool-button.is-success {
      border-color: rgba(34, 197, 94, 0.5);
      background: rgba(34, 197, 94, 0.16);
      color: #dcfce7;
    }

    .tabs-bar {
      display: flex;
      align-items: stretch;
      gap: 8px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      background: rgba(8, 15, 24, 0.72);
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .tabs {
      display: flex;
      gap: 8px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 180px;
      max-width: 280px;
      height: var(--tab-height);
      padding: 0 12px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(15, 23, 42, 0.55);
      color: var(--text-subtle);
      cursor: pointer;
      user-select: none;
    }

    .tab.active {
      color: var(--text-main);
      border-color: rgba(56, 189, 248, 0.45);
      background: linear-gradient(180deg, rgba(14, 165, 233, 0.18), rgba(34, 197, 94, 0.14));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .tab-label {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .tab-close {
      appearance: none;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 16px;
      cursor: pointer;
      padding: 0;
      width: 18px;
      height: 18px;
      line-height: 18px;
      border-radius: 999px;
    }

    .tab-close:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .tab-actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .terminal-wrap {
      position: relative;
      flex: 1;
      min-height: 0;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mobile-fold-toggle {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 6;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.28);
      background: rgba(7, 15, 24, 0.82);
      color: var(--text-main);
      font: inherit;
      font-size: 11px;
      line-height: 1;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
      cursor: pointer;
    }

    .mobile-fold-toggle:hover {
      border-color: rgba(56, 189, 248, 0.55);
      background: rgba(14, 23, 42, 0.92);
    }

    .terminal-stack {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 180px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.14);
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.92), rgba(3, 7, 18, 0.98));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .terminal-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      display: none;
    }

    .terminal-frame.active {
      display: block;
    }

    .terminal-note {
      position: absolute;
      right: 20px;
      bottom: 18px;
      pointer-events: none;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.62);
      border: 1px solid rgba(148, 163, 184, 0.18);
      color: rgba(226, 232, 240, 0.68);
      font-size: 11px;
      letter-spacing: 0.02em;
      backdrop-filter: blur(10px);
      z-index: 2;
    }

    .copy-toast {
      position: absolute;
      left: 20px;
      bottom: 18px;
      z-index: 3;
      max-width: min(52vw, 420px);
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(7, 15, 24, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.24);
      color: rgba(226, 232, 240, 0.88);
      font-size: 12px;
      line-height: 1.5;
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
    }

    .copy-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .dialog-panel {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 162px;
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      background: linear-gradient(180deg, rgba(9, 16, 28, 0.96), rgba(7, 12, 20, 0.98));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    .dialog-panel.collapsed {
      min-height: 0;
    }

    .dialog-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      background: rgba(15, 23, 42, 0.52);
    }

    .dialog-panel-title {
      min-width: 0;
    }

    .dialog-panel-title strong {
      display: block;
      font-size: 13px;
      letter-spacing: 0.02em;
    }

    .dialog-panel-title span {
      display: block;
      margin-top: 3px;
      color: var(--text-subtle);
      font-size: 11px;
      line-height: 1.4;
    }

    .dialog-panel-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .dialog-status {
      color: var(--text-subtle);
      font-size: 11px;
      line-height: 1.4;
    }

    .dialog-panel-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px 14px 14px;
    }

    .dialog-panel.collapsed .dialog-panel-body {
      display: none;
    }

    .dialog-textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.76);
      color: var(--text-main);
      padding: 12px 14px;
      font: inherit;
      font-size: 13px;
      line-height: 1.65;
      outline: none;
    }

    .dialog-textarea:focus {
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }

    .dialog-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .dialog-actions-left,
    .dialog-actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dialog-hint {
      color: var(--text-subtle);
      font-size: 11px;
      line-height: 1.5;
    }

    .resize-handle {
      position: absolute;
      pointer-events: auto;
      z-index: 5;
      background: transparent;
    }

    .resize-handle::before {
      content: "";
      position: absolute;
      inset: 0;
    }

    .resize-handle[data-dir="n"] {
      top: -6px;
      left: 14px;
      right: 14px;
      height: 12px;
      cursor: ns-resize;
    }

    .resize-handle[data-dir="s"] {
      bottom: -6px;
      left: 14px;
      right: 14px;
      height: 12px;
      cursor: ns-resize;
    }

    .resize-handle[data-dir="w"] {
      top: 14px;
      bottom: 14px;
      left: -6px;
      width: 12px;
      cursor: ew-resize;
    }

    .resize-handle[data-dir="e"] {
      top: 14px;
      bottom: 14px;
      right: -6px;
      width: 12px;
      cursor: ew-resize;
    }

    .resize-handle[data-dir="nw"] {
      top: -6px;
      left: -6px;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
    }

    .resize-handle[data-dir="ne"] {
      top: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      cursor: nesw-resize;
    }

    .resize-handle[data-dir="sw"] {
      bottom: -6px;
      left: -6px;
      width: 18px;
      height: 18px;
      cursor: nesw-resize;
    }

    .resize-handle[data-dir="se"] {
      bottom: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
    }

    .resize-handle[data-dir="se"]::before {
      border-right: 2px solid rgba(56, 189, 248, 0.75);
      border-bottom: 2px solid rgba(56, 189, 248, 0.75);
      border-bottom-right-radius: 4px;
    }

    .resize-handle[data-dir="se"]::after {
      content: "";
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 8px;
      height: 8px;
      border-right: 2px solid rgba(34, 197, 94, 0.8);
      border-bottom: 2px solid rgba(34, 197, 94, 0.8);
    }

    .embed-root,
    .embed-root body,
    .embed-root #terminal {
      background: #000;
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .embed-root #terminal {
      display: flex;
      min-height: 0;
    }

    .embed-terminal {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(2, 6, 23, 0.96), rgba(3, 7, 18, 1));
      min-height: var(--app-height);
      height: var(--app-height);
    }

    .embed-terminal .xterm {
      height: 100%;
      width: 100%;
      min-height: 0;
      padding: 12px 10px 8px;
      box-sizing: border-box;
    }

    .embed-terminal .xterm-viewport {
      overflow-y: auto !important;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
      max-height: 100%;
    }

    .embed-terminal .xterm-screen canvas {
      border-radius: 8px;
    }

    .embed-terminal .xterm-screen,
    .embed-terminal .xterm-helpers,
    .embed-terminal .terminal,
    .embed-terminal .xterm-helper-textarea {
      touch-action: manipulation;
    }

    @media (max-width: 980px) {
      html, body {
        overflow: hidden;
      }

      .page {
        width: 100%;
        height: var(--app-height);
        min-height: var(--app-height);
        overflow: hidden;
      }

      .shell {
        position: relative;
        inset: auto;
        transform: none;
        width: calc(100vw - 8px);
        min-width: 0;
        height: calc(var(--app-height) - 8px);
        min-height: calc(var(--app-height) - 8px);
        max-width: calc(100vw - 8px);
        max-height: none;
        margin: 4px;
        border-radius: 16px;
      }

      .shell-header {
        flex-direction: column;
        align-items: flex-start;
        cursor: default;
        gap: 10px;
        padding: 12px 14px 10px;
      }

      .shell-tools {
        width: 100%;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .shell-hints {
        text-align: left;
        font-size: 11px;
        line-height: 1.5;
      }

      .tabs-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 10px 10px 8px;
      }

      .tabs {
        overflow-x: auto;
      }

      .tab-actions {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .tool-button {
        flex: 1;
        min-height: 36px;
        padding: 8px 10px;
        font-size: 11px;
      }

      .tab {
        min-width: 124px;
        max-width: 220px;
        height: 38px;
        padding: 0 10px;
        border-radius: 12px;
      }

      .tab-label {
        font-size: 11px;
      }

      .terminal-wrap {
        padding: 8px;
      }

      .terminal-stack {
        border-radius: 14px;
      }

      .mobile-fold-toggle {
        display: inline-flex;
        top: 14px;
        right: 14px;
      }

      .dialog-panel {
        min-height: 148px;
        border-radius: 14px;
      }

      .dialog-panel-header,
      .dialog-panel-body {
        padding-left: 12px;
        padding-right: 12px;
      }

      .dialog-textarea {
        min-height: 96px;
        font-size: 12px;
      }

      .shell.compact-top .shell-header,
      .shell.compact-top .tabs-bar {
        display: none;
      }

      .shell.compact-top .terminal-wrap {
        padding-top: 4px;
      }

      .resize-handle,
      .terminal-note {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .title-copy strong {
        font-size: 13px;
      }

      .title-copy span {
        font-size: 11px;
      }

      .traffic {
        gap: 6px;
      }

      .traffic span {
        width: 10px;
        height: 10px;
      }

      .shell-header {
        padding: 10px 12px 8px;
      }

      .shell-tools .tool-buttons {
        width: 100%;
      }

      .tool-buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page" id="managerRoot">
    <section class="shell" id="shell">
      <header class="shell-header" id="shellHeader">
        <div class="shell-title">
          <span class="traffic" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <div class="title-copy">
            <strong>Codex Web Terminal</strong>
            <span>支持 FinalShell 风格复制标签，同页切换多个终端视图</span>
          </div>
        </div>
        <div class="shell-tools">
          <div class="shell-hints">
            复制标签会新增一个同服务器终端标签；任意边和角都可缩放
          </div>
          <div class="tool-buttons">
            <a class="tool-button" href="/codex-system" target="_blank" rel="noreferrer">系统概览</a>
            <a class="tool-button" href="/codex-files" target="_blank" rel="noreferrer">文件管理</a>
            <button class="tool-button" id="toggleDialogPanelButton" type="button">对话窗</button>
            <button class="tool-button" id="copySelectionButton" type="button">复制选中</button>
            <button class="tool-button" id="copyVisibleButton" type="button">复制可见内容</button>
            <button class="tool-button" id="centerButton" type="button">居中</button>
            <button class="tool-button" id="fitButton" type="button">最大化</button>
          </div>
        </div>
      </header>
      <div class="tabs-bar">
        <div class="tabs" id="tabs"></div>
        <div class="tab-actions">
          <button class="tool-button" id="renameTabButton" type="button">重命名标签</button>
          <button class="tool-button" id="duplicateTabButton" type="button">复制标签</button>
          <button class="tool-button" id="newTabButton" type="button">新建标签</button>
        </div>
      </div>
      <div class="terminal-wrap">
        <button class="mobile-fold-toggle" id="mobileToggleChromeButton" type="button">收起顶部</button>
        <div class="terminal-stack" id="terminalStack"></div>
        <section class="dialog-panel" id="dialogPanel">
          <div class="dialog-panel-header">
            <div class="dialog-panel-title">
              <strong>终端对话窗口</strong>
              <span>先在这里组织多行指令或对话，再一键发送到当前终端标签。</span>
            </div>
            <div class="dialog-panel-tools">
              <span class="dialog-status" id="dialogStatus">草稿自动保存在浏览器本地</span>
              <button class="tool-button" id="collapseDialogButton" type="button">收起</button>
            </div>
          </div>
          <div class="dialog-panel-body">
            <textarea class="dialog-textarea" id="dialogTextarea" placeholder="在这里输入你要发给当前终端的内容。支持多行。按 Ctrl+Enter 可直接发送到当前终端。"></textarea>
            <div class="dialog-actions">
              <div class="dialog-actions-left">
                <button class="tool-button" id="sendDialogButton" type="button">发送到终端</button>
                <button class="tool-button" id="copyDialogButton" type="button">复制草稿</button>
                <button class="tool-button" id="clearDialogButton" type="button">清空草稿</button>
              </div>
              <div class="dialog-actions-right">
                <span class="dialog-hint">发送失败时会自动退回到复制剪贴板，你只需在终端里粘贴即可。</span>
              </div>
            </div>
          </div>
        </section>
        <div class="copy-toast" id="copyToast" aria-live="polite"></div>
        <div class="terminal-note">终端内不方便框选时，可直接用“复制选中”或“复制可见内容”</div>
      </div>
      <div class="resize-handle" data-dir="n" aria-hidden="true"></div>
      <div class="resize-handle" data-dir="s" aria-hidden="true"></div>
      <div class="resize-handle" data-dir="w" aria-hidden="true"></div>
      <div class="resize-handle" data-dir="e" aria-hidden="true"></div>
      <div class="resize-handle" data-dir="nw" aria-hidden="true"></div>
      <div class="resize-handle" data-dir="ne" aria-hidden="true"></div>
      <div class="resize-handle" data-dir="sw" aria-hidden="true"></div>
      <div class="resize-handle" data-dir="se" aria-hidden="true"></div>
    </section>
  </main>

  <div class="embed-terminal hidden" id="embedRoot">
    <div id="terminal"></div>
  </div>

  <script src="./auth_token.js"></script>
  <script src="./config.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const debugEnabled = params.get("debug") === "1" || localStorage.getItem("codex-web-terminal-debug") === "1";
      const debug = (...args) => {
        if (!debugEnabled) return;
        console.debug("[codex-web-terminal]", ...args);
      };
      const isEmbed = params.get("embed") === "1";
      let rafId = 0;
      let dispatchingSyntheticResize = false;

      const dispatchResize = () => {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(() => {
          rafId = 0;
          dispatchingSyntheticResize = true;
          try {
            window.dispatchEvent(new Event("resize"));
          } finally {
            dispatchingSyntheticResize = false;
          }
        });
      };

      const updateViewportHeight = () => {
        const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        document.documentElement.style.setProperty("--app-height", `${Math.round(viewportHeight)}px`);
        debug("viewport:update", {
          viewportHeight,
          innerHeight: window.innerHeight,
          mobile: window.matchMedia("(max-width: 980px)").matches,
          embed: isEmbed
        });
        dispatchResize();
      };

      if (isEmbed) {
        document.body.classList.add("embed-mode");
        document.documentElement.classList.add("embed-root");
        document.getElementById("managerRoot").classList.add("hidden");
        document.getElementById("embedRoot").classList.remove("hidden");
        updateViewportHeight();
        if (window.visualViewport) {
          window.visualViewport.addEventListener("resize", updateViewportHeight);
          window.visualViewport.addEventListener("scroll", updateViewportHeight);
        }
        window.addEventListener("resize", () => {
          if (dispatchingSyntheticResize) return;
          updateViewportHeight();
        });
        window.addEventListener("orientationchange", updateViewportHeight);
        window.setTimeout(updateViewportHeight, 80);
        window.setTimeout(updateViewportHeight, 320);
        debug("embed-mode", Object.fromEntries(params.entries()));
        const script = document.createElement("script");
        script.src = "./js/gotty.js";
        script.async = false;
        document.body.appendChild(script);
        return;
      }

      const shell = document.getElementById("shell");
      const shellHeader = document.getElementById("shellHeader");
      const tabsEl = document.getElementById("tabs");
      const terminalStack = document.getElementById("terminalStack");
      const centerButton = document.getElementById("centerButton");
      const fitButton = document.getElementById("fitButton");
      const toggleDialogPanelButton = document.getElementById("toggleDialogPanelButton");
      const copySelectionButton = document.getElementById("copySelectionButton");
      const copyVisibleButton = document.getElementById("copyVisibleButton");
      const dialogPanel = document.getElementById("dialogPanel");
      const dialogTextarea = document.getElementById("dialogTextarea");
      const dialogStatus = document.getElementById("dialogStatus");
      const collapseDialogButton = document.getElementById("collapseDialogButton");
      const sendDialogButton = document.getElementById("sendDialogButton");
      const copyDialogButton = document.getElementById("copyDialogButton");
      const clearDialogButton = document.getElementById("clearDialogButton");
      const renameTabButton = document.getElementById("renameTabButton");
      const duplicateTabButton = document.getElementById("duplicateTabButton");
      const newTabButton = document.getElementById("newTabButton");
      const mobileToggleChromeButton = document.getElementById("mobileToggleChromeButton");
      const copyToast = document.getElementById("copyToast");
      const resizeHandles = Array.from(document.querySelectorAll(".resize-handle"));
      const mobileMedia = window.matchMedia("(max-width: 980px)");
      const layoutKey = "codex-web-terminal-layout-v3";
      const tabsKey = "codex-web-terminal-tabs-v3";
      const mobileChromeKey = "codex-web-terminal-mobile-top-v1";
      const dialogDraftKey = "codex-web-terminal-dialog-draft-v1";
      const dialogPanelKey = "codex-web-terminal-dialog-panel-v1";

      let dragState = null;
      let resizeState = null;
      let activeTabId = null;
      let tabs = [];
      let copyToastTimer = 0;

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);
      const desktopBounds = () => ({ width: window.innerWidth, height: window.innerHeight });
      const baseUrl = () => `${window.location.origin}${window.location.pathname}`;
      const makeId = () => `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const createPrimaryTab = () => ({
        id: "main",
        title: "系统终端",
        session: "codex-main"
      });
      const isPrimaryTab = (tab) => tab && tab.session === "codex-main";
      const readMobileChromeState = () => localStorage.getItem(mobileChromeKey) === "collapsed";
      const writeMobileChromeState = (collapsed) => localStorage.setItem(mobileChromeKey, collapsed ? "collapsed" : "expanded");

      const applyMobileChromeState = (collapsed) => {
        const nextCollapsed = Boolean(collapsed && mobileMedia.matches);
        shell.classList.toggle("compact-top", nextCollapsed);
        if (mobileToggleChromeButton) {
          mobileToggleChromeButton.textContent = nextCollapsed ? "展开顶部" : "收起顶部";
          mobileToggleChromeButton.setAttribute("aria-pressed", nextCollapsed ? "true" : "false");
        }
        debug("mobile:chrome", { collapsed: nextCollapsed, mobile: mobileMedia.matches });
        dispatchResize();
      };

      const syncMobileChromeState = () => {
        applyMobileChromeState(readMobileChromeState());
      };

      const defaultLayout = () => {
        const bounds = desktopBounds();
        const width = Math.min(1380, bounds.width - 32);
        const height = Math.min(Math.max(620, Math.round(bounds.height * 0.84)), bounds.height - 32);
        return {
          width,
          height,
          left: Math.round((bounds.width - width) / 2),
          top: Math.round((bounds.height - height) / 2)
        };
      };

      const saveLayout = () => {
        if (mobileMedia.matches) return;
        const rect = shell.getBoundingClientRect();
        const next = {
          left: Math.round(rect.left),
          top: Math.round(rect.top),
          width: Math.round(rect.width),
          height: Math.round(rect.height)
        };
        debug("saveLayout", next);
        localStorage.setItem(layoutKey, JSON.stringify(next));
      };

      const applyLayout = (layout) => {
        if (mobileMedia.matches) {
          shell.style.left = "";
          shell.style.top = "";
          shell.style.width = "";
          shell.style.height = "";
          shell.style.transform = "";
          dispatchResize();
          return;
        }

        const bounds = desktopBounds();
        const minWidth = 860;
        const minHeight = 600;
        const width = clamp(layout.width, minWidth, bounds.width - 16);
        const height = clamp(layout.height, minHeight, bounds.height - 16);
        const left = clamp(layout.left, 8, bounds.width - width - 8);
        const top = clamp(layout.top, 8, bounds.height - height - 8);

        shell.style.transform = "none";
        shell.style.left = `${left}px`;
        shell.style.top = `${top}px`;
        shell.style.width = `${width}px`;
        shell.style.height = `${height}px`;
        debug("applyLayout", { left, top, width, height });
        dispatchResize();
      };

      const loadLayout = () => {
        updateViewportHeight();
        syncMobileChromeState();
        if (mobileMedia.matches) {
          applyLayout(defaultLayout());
          return;
        }

        try {
          const raw = localStorage.getItem(layoutKey);
          applyLayout(raw ? JSON.parse(raw) : defaultLayout());
        } catch (_error) {
          applyLayout(defaultLayout());
        }
      };

      const saveTabs = () => {
        localStorage.setItem(tabsKey, JSON.stringify({ tabs, activeTabId }));
      };

      const createSessionName = (tabId) => `codex-tab-${tabId}`.slice(0, 48);
      const nextTerminalNumber = () => {
        const used = new Set(
          tabs
            .map((tab) => /^终端\s+(\d+)$/.exec((tab.title || "").trim()))
            .filter(Boolean)
            .map((match) => Number(match[1]))
            .filter(Number.isFinite)
        );
        let next = 1;
        while (used.has(next)) next += 1;
        return next;
      };

      const createTabModel = (index, overrides = {}) => {
        if ((index === 1 && !overrides.session && !overrides.id && !overrides.title) || overrides.session === "codex-main") {
          return {
            ...createPrimaryTab(),
            ...overrides
          };
        }
        const id = overrides.id || makeId();
        return {
          id,
          title: overrides.title || `终端 ${index}`,
          session: overrides.session || createSessionName(id)
        };
      };

      const ensureUniqueSessions = (items) => {
        const seen = new Set();
        return items.map((tab, index) => {
          let session = tab.session || createSessionName(tab.id || makeId());
          if (seen.has(session)) {
            session = createSessionName(`${tab.id || makeId()}-${index}`);
          }
          seen.add(session);
          return {
            ...tab,
            session
          };
        });
      };

      const normalizeTabs = (items) => {
        const normalized = ensureUniqueSessions(items.map((tab, index) => createTabModel(index + 1, tab)));
        const primary = normalized.find(isPrimaryTab) || createPrimaryTab();
        const rest = normalized.filter((tab) => !isPrimaryTab(tab));
        return [primary, ...rest];
      };

      const restoreTabsFromServer = async () => {
        try {
          const response = await fetch("/api/v1/codex/sessions", {
            credentials: "include",
            cache: "no-store"
          });
          if (!response.ok) {
            return null;
          }
          const items = await response.json();
          if (!Array.isArray(items) || !items.length) {
            return null;
          }
          return normalizeTabs(items.map((item, index) => createTabModel(index + 1, {
            id: item.session === "codex-main" ? "main" : item.session,
            title: item.title,
            session: item.session
          })));
        } catch (_error) {
          return null;
        }
      };

      const loadTabs = async () => {
        try {
          const raw = localStorage.getItem(tabsKey);
          if (!raw) {
            const serverTabs = await restoreTabsFromServer();
            tabs = serverTabs && serverTabs.length ? serverTabs : normalizeTabs([createPrimaryTab()]);
            activeTabId = tabs[0].id;
            return;
          }
          const parsed = JSON.parse(raw);
          tabs = Array.isArray(parsed.tabs) && parsed.tabs.length
            ? normalizeTabs(parsed.tabs)
            : (await restoreTabsFromServer()) || normalizeTabs([createPrimaryTab()]);
          activeTabId = parsed.activeTabId && tabs.some((tab) => tab.id === parsed.activeTabId)
            ? parsed.activeTabId
            : tabs[0].id;
        } catch (_error) {
          const serverTabs = await restoreTabsFromServer();
          tabs = serverTabs && serverTabs.length ? serverTabs : normalizeTabs([createPrimaryTab()]);
          activeTabId = tabs[0].id;
        }
      };

      const frameSrc = (tab) =>
        `${baseUrl()}?embed=1&tab=${encodeURIComponent(tab.id)}&arg=${encodeURIComponent(tab.session)}`;
      const readDialogPanelState = () => localStorage.getItem(dialogPanelKey) !== "collapsed";
      const writeDialogPanelState = (expanded) => localStorage.setItem(dialogPanelKey, expanded ? "expanded" : "collapsed");
      const applyDialogPanelState = (expanded) => {
        const nextExpanded = Boolean(expanded);
        dialogPanel.classList.toggle("collapsed", !nextExpanded);
        collapseDialogButton.textContent = nextExpanded ? "收起" : "展开";
        toggleDialogPanelButton.classList.toggle("is-success", nextExpanded);
        toggleDialogPanelButton.textContent = nextExpanded ? "对话窗已开" : "对话窗";
        dispatchResize();
      };
      const restoreDialogDraft = () => {
        const draft = localStorage.getItem(dialogDraftKey) || "";
        dialogTextarea.value = draft;
      };
      const updateDialogStatus = (message) => {
        if (dialogStatus) dialogStatus.textContent = message;
      };
      const saveDialogDraft = () => {
        localStorage.setItem(dialogDraftKey, dialogTextarea.value);
        updateDialogStatus(dialogTextarea.value.trim() ? "草稿已自动保存到浏览器本地" : "草稿为空");
      };

      const renameTab = (tabId) => {
        const tab = tabs.find((item) => item.id === tabId);
        if (!tab) return;
        const nextTitle = window.prompt("输入新的标签名称", tab.title);
        if (nextTitle === null) return;
        const trimmed = nextTitle.trim();
        if (!trimmed) return;
        tab.title = trimmed.slice(0, 40);
        debug("tab:rename", { id: tab.id, title: tab.title });
        renderTabs();
        saveTabs();
      };

      const renderTabs = () => {
        tabsEl.innerHTML = "";
        terminalStack.querySelectorAll(".terminal-frame").forEach((frame) => frame.remove());

        tabs.forEach((tab) => {
          const primary = isPrimaryTab(tab);
          const tabEl = document.createElement("div");
          tabEl.className = `tab${tab.id === activeTabId ? " active" : ""}`;
          tabEl.dataset.tabId = tab.id;
          tabEl.innerHTML = `
            <span class="tab-label">${tab.title}</span>
            <button class="tab-close${primary ? " hidden" : ""}" type="button" aria-label="关闭标签"${primary ? ' tabindex="-1"' : ""}>×</button>
          `;
          tabsEl.appendChild(tabEl);

          const iframe = document.createElement("iframe");
          iframe.className = `terminal-frame${tab.id === activeTabId ? " active" : ""}`;
          iframe.dataset.tabId = tab.id;
          iframe.src = frameSrc(tab);
          iframe.title = tab.title;
          terminalStack.appendChild(iframe);

          tabEl.addEventListener("click", (event) => {
            if (event.target.closest(".tab-close")) return;
            activeTabId = tab.id;
            debug("tab:activate", tab.id);
            renderTabs();
            saveTabs();
          });

          tabEl.addEventListener("dblclick", (event) => {
            if (event.target.closest(".tab-close")) return;
            renameTab(tab.id);
          });

          tabEl.querySelector(".tab-close").addEventListener("click", (event) => {
            event.stopPropagation();
            if (primary || tabs.length === 1) return;
            tabs = tabs.filter((item) => item.id !== tab.id);
            if (activeTabId === tab.id) {
              activeTabId = tabs[0].id;
            }
            debug("tab:close", tab.id);
            renderTabs();
            saveTabs();
          });
        });
      };

      const addTab = (mode) => {
        const activeTab = tabs.find((tab) => tab.id === activeTabId);
        const nextIndex = nextTerminalNumber();
        const tab = createTabModel(nextIndex, {
          title: mode === "duplicate" && activeTab
            ? `${activeTab.title} 副本`
            : `终端 ${nextIndex}`
        });
        tabs.push(tab);
        activeTabId = tab.id;
        debug(mode === "duplicate" ? "tab:duplicate" : "tab:new", {
          id: tab.id,
          session: tab.session
        });
        renderTabs();
        saveTabs();
      };

      const currentRect = () => shell.getBoundingClientRect();
      const activeFrame = () => terminalStack.querySelector(`.terminal-frame[data-tab-id="${activeTabId}"]`);
      const showCopyToast = (message, ok = true) => {
        if (!copyToast) return;
        copyToast.textContent = message;
        copyToast.classList.add("show");
        copyToast.style.borderColor = ok ? "rgba(34, 197, 94, 0.32)" : "rgba(248, 113, 113, 0.36)";
        copyToast.style.color = ok ? "rgba(220, 252, 231, 0.96)" : "rgba(254, 226, 226, 0.96)";
        clearTimeout(copyToastTimer);
        copyToastTimer = window.setTimeout(() => {
          copyToast.classList.remove("show");
        }, 1800);
      };
      const setCopyButtonState = (button, label) => {
        if (!button) return;
        const original = button.dataset.originalLabel || button.textContent;
        if (!button.dataset.originalLabel) button.dataset.originalLabel = original;
        button.textContent = label;
        button.classList.add("is-success");
        window.setTimeout(() => {
          button.textContent = button.dataset.originalLabel || original;
          button.classList.remove("is-success");
        }, 1200);
      };
      const normalizeCopiedText = (value) => value
        .replace(/\u00a0/g, " ")
        .replace(/\r/g, "")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
      const getFrameSelectionText = (frame) => {
        try {
          return normalizeCopiedText(frame?.contentWindow?.getSelection?.().toString?.() || "");
        } catch (_error) {
          return "";
        }
      };
      const getFrameVisibleText = (frame) => {
        try {
          const doc = frame?.contentDocument;
          if (!doc) return "";
          const candidates = [
            ".xterm-accessibility-tree",
            ".xterm-rows",
            ".terminal"
          ];
          for (const selector of candidates) {
            const el = doc.querySelector(selector);
            const text = normalizeCopiedText(el?.innerText || el?.textContent || "");
            if (text) return text;
          }
          return normalizeCopiedText(doc.body?.innerText || "");
        } catch (_error) {
          return "";
        }
      };
      const copyText = async (value, successLabel) => {
        const text = normalizeCopiedText(value || "");
        if (!text) {
          showCopyToast("没有可复制的内容，先在终端里选中，或使用“复制可见内容”。", false);
          return;
        }
        try {
          await navigator.clipboard.writeText(text);
          showCopyToast(`已复制 ${Math.min(text.length, 9999)} 个字符`);
          return successLabel;
        } catch (_error) {
          const helper = document.createElement("textarea");
          helper.value = text;
          helper.setAttribute("readonly", "readonly");
          helper.style.position = "fixed";
          helper.style.opacity = "0";
          document.body.appendChild(helper);
          helper.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(helper);
          if (!ok) {
            showCopyToast("复制失败，请检查浏览器剪贴板权限。", false);
            return "";
          }
          showCopyToast(`已复制 ${Math.min(text.length, 9999)} 个字符`);
          return successLabel;
        }
      };
      const copyCurrentSelection = async () => {
        const frame = activeFrame();
        const copied = await copyText(getFrameSelectionText(frame), "已复制");
        if (copied) setCopyButtonState(copySelectionButton, copied);
      };
      const copyCurrentVisibleText = async () => {
        const frame = activeFrame();
        const copied = await copyText(getFrameVisibleText(frame), "已复制");
        if (copied) setCopyButtonState(copyVisibleButton, copied);
      };
      const getTerminalInputTarget = (frame) => {
        try {
          const doc = frame?.contentDocument;
          if (!doc) return null;
          return doc.querySelector(".xterm-helper-textarea, textarea");
        } catch (_error) {
          return null;
        }
      };
      const sendTextToTerminal = async (value) => {
        const text = normalizeCopiedText(value || "");
        if (!text) {
          showCopyToast("对话窗口还是空的，先输入内容。", false);
          return false;
        }
        const payload = text.endsWith("\n") ? text : `${text}\n`;
        const frame = activeFrame();
        const target = getTerminalInputTarget(frame);
        if (!frame || !target) {
          const copied = await copyText(payload, "已复制");
          if (copied) {
            setCopyButtonState(sendDialogButton, copied);
            updateDialogStatus("未找到终端输入框，已退回到复制剪贴板");
          }
          return false;
        }
        try {
          frame.contentWindow?.focus?.();
          target.focus?.();
          let sent = false;
          try {
            const data = new DataTransfer();
            data.setData("text/plain", payload);
            const pasteEvent = new ClipboardEvent("paste", {
              clipboardData: data,
              bubbles: true,
              cancelable: true
            });
            target.dispatchEvent(pasteEvent);
            sent = true;
          } catch (_error) {
          }
          if (!sent) {
            try {
              target.value = payload;
              target.dispatchEvent(new InputEvent("input", {
                data: payload,
                inputType: "insertText",
                bubbles: true,
                cancelable: true
              }));
              sent = true;
            } catch (_error) {
            }
          }
          if (!sent) {
            const copied = await copyText(payload, "已复制");
            if (copied) {
              setCopyButtonState(sendDialogButton, copied);
              updateDialogStatus("终端注入失败，已复制到剪贴板");
            }
            return false;
          }
          setCopyButtonState(sendDialogButton, "已发送");
          updateDialogStatus("内容已发送到当前终端");
          showCopyToast("已发送到当前终端");
          return true;
        } catch (_error) {
          const copied = await copyText(payload, "已复制");
          if (copied) {
            setCopyButtonState(sendDialogButton, copied);
            updateDialogStatus("发送异常，已复制到剪贴板");
          }
          return false;
        }
      };

      const centerLayout = () => {
        debug("centerLayout");
        localStorage.removeItem(layoutKey);
        applyLayout(defaultLayout());
      };

      const fitLayout = () => {
        if (mobileMedia.matches) return;
        debug("fitLayout");
        applyLayout({
          left: 8,
          top: 8,
          width: window.innerWidth - 16,
          height: window.innerHeight - 16
        });
        saveLayout();
      };

      shellHeader.addEventListener("pointerdown", (event) => {
        if (mobileMedia.matches || event.target.closest("button")) return;
        dragState = {
          startX: event.clientX,
          startY: event.clientY,
          rect: currentRect()
        };
        debug("drag:start", dragState);
        event.preventDefault();
      });

      const endDrag = () => {
        if (!dragState) return;
        debug("drag:end");
        dragState = null;
        saveLayout();
      };

      const updateResize = (event) => {
        if (!resizeState) return;
        const dx = event.clientX - resizeState.startX;
        const dy = event.clientY - resizeState.startY;
        const rect = resizeState.rect;
        let nextLeft = rect.left;
        let nextTop = rect.top;
        let nextWidth = rect.width;
        let nextHeight = rect.height;

        if (resizeState.dir.includes("e")) nextWidth = rect.width + dx;
        if (resizeState.dir.includes("s")) nextHeight = rect.height + dy;
        if (resizeState.dir.includes("w")) {
          nextWidth = rect.width - dx;
          nextLeft = rect.left + dx;
        }
        if (resizeState.dir.includes("n")) {
          nextHeight = rect.height - dy;
          nextTop = rect.top + dy;
        }

        applyLayout({
          left: nextLeft,
          top: nextTop,
          width: nextWidth,
          height: nextHeight
        });
      };

      const endResize = () => {
        if (!resizeState) return;
        debug("resize:end", resizeState.dir);
        resizeState = null;
        saveLayout();
      };

      resizeHandles.forEach((handle) => {
        handle.addEventListener("pointerdown", (event) => {
          if (mobileMedia.matches) return;
          resizeState = {
            dir: handle.dataset.dir || "se",
            startX: event.clientX,
            startY: event.clientY,
            rect: currentRect()
          };
          debug("resize:start", resizeState.dir, resizeState);
          event.preventDefault();
          event.stopPropagation();
        });
      });

      document.addEventListener("pointermove", (event) => {
        if (dragState && !mobileMedia.matches) {
          applyLayout({
            left: dragState.rect.left + (event.clientX - dragState.startX),
            top: dragState.rect.top + (event.clientY - dragState.startY),
            width: dragState.rect.width,
            height: dragState.rect.height
          });
          return;
        }
        if (resizeState && !mobileMedia.matches) {
          updateResize(event);
        }
      });

      document.addEventListener("pointerup", () => {
        endDrag();
        endResize();
      });

      document.addEventListener("pointercancel", () => {
        endDrag();
        endResize();
      });

      centerButton.addEventListener("click", centerLayout);
      fitButton.addEventListener("click", fitLayout);
      toggleDialogPanelButton.addEventListener("click", () => {
        const expanded = dialogPanel.classList.contains("collapsed");
        writeDialogPanelState(expanded);
        applyDialogPanelState(expanded);
      });
      copySelectionButton.addEventListener("click", copyCurrentSelection);
      copyVisibleButton.addEventListener("click", copyCurrentVisibleText);
      collapseDialogButton.addEventListener("click", () => {
        const expanded = dialogPanel.classList.contains("collapsed");
        writeDialogPanelState(expanded);
        applyDialogPanelState(expanded);
      });
      sendDialogButton.addEventListener("click", () => {
        sendTextToTerminal(dialogTextarea.value);
      });
      copyDialogButton.addEventListener("click", async () => {
        const copied = await copyText(dialogTextarea.value, "已复制");
        if (copied) setCopyButtonState(copyDialogButton, copied);
      });
      clearDialogButton.addEventListener("click", () => {
        dialogTextarea.value = "";
        saveDialogDraft();
        updateDialogStatus("草稿已清空");
      });
      dialogTextarea.addEventListener("input", saveDialogDraft);
      renameTabButton.addEventListener("click", () => {
        if (!activeTabId) return;
        renameTab(activeTabId);
      });
      duplicateTabButton.addEventListener("click", () => addTab("duplicate"));
      newTabButton.addEventListener("click", () => addTab("new"));
      mobileToggleChromeButton.addEventListener("click", () => {
        const nextCollapsed = !shell.classList.contains("compact-top");
        writeMobileChromeState(nextCollapsed);
        applyMobileChromeState(nextCollapsed);
      });
      shellHeader.addEventListener("dblclick", centerLayout);
      window.addEventListener("resize", () => {
        if (dispatchingSyntheticResize) return;
        loadLayout();
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", loadLayout);
        window.visualViewport.addEventListener("scroll", loadLayout);
      }
      window.addEventListener("orientationchange", loadLayout);
      window.addEventListener("load", () => {
        updateViewportHeight();
        debug("window:load", {
          innerWidth: window.innerWidth,
          innerHeight: window.innerHeight,
          mobile: mobileMedia.matches
        });
      });
      document.addEventListener("keydown", (event) => {
        if (event.altKey && !event.shiftKey && !event.ctrlKey && !event.metaKey && event.key.toLowerCase() === "c") {
          event.preventDefault();
          copyCurrentVisibleText();
        }
        if (event.ctrlKey && !event.shiftKey && !event.altKey && !event.metaKey && event.key === "Enter" && document.activeElement === dialogTextarea) {
          event.preventDefault();
          sendTextToTerminal(dialogTextarea.value);
        }
      });

      new ResizeObserver(() => dispatchResize()).observe(shell);
      updateViewportHeight();
      syncMobileChromeState();
      restoreDialogDraft();
      applyDialogPanelState(readDialogPanelState());
      loadTabs().then(() => {
        renderTabs();
        loadLayout();
        saveTabs();
      });
    })();
  </script>
</body>
</html>
